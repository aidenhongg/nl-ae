[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "nl-ae"
version = "0.1.0"
description = "Minimal recreation of Wang et al. 2024 'My Answer is C' — first-token vs free-generation disagreement on MMLU + OpinionQA."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Aiden Hong" }]
keywords = ["llm", "evaluation", "mmlu", "opinionqa", "qwen"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]

# Pinned per .plans/conductor-plan/QUESTIONS.md C8 (resolved 2026-05-12).
# Heavy ML deps are optional extras so the CLI imports and tests stay light.
dependencies = [
  "pydantic>=2.6,<3.0",
  "pyarrow>=16",
  "click>=8.1,<9",
  "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
# Pins are ranges, not equalities: the plan's `QUESTIONS.md` C8 picked future
# point versions that don't co-resolve (transformers 5.8 wants huggingface_hub
# >= 1.5, but C8 also pinned hub == 0.26). The transitive constraint from
# whichever transformers minor you install determines the hub version, so
# we just let pip resolve.
model = [
  "torch>=2.5,<3.0",
  "transformers>=4.45,<6.0",
  "accelerate>=1.0,<2.0",
  "datasets>=3.0,<4.0",
]
quant = [
  # Required only when QuantizationSpec.kind starts with "int" (NF4 / int8). MVP runs fp16.
  "bitsandbytes>=0.43,<1.0",
]
report = [
  "pandas>=2.2,<3.0",
  "matplotlib>=3.8,<4.0",
  "numpy>=1.26,<3.0",
]
probes = [
  # Phase 2 only; not required for MVP.
  "scikit-learn>=1.5,<2.0",
]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "mypy>=1.10",
]

[project.scripts]
nlae = "nl_ae.cli.main:main"

[project.urls]
"Homepage" = "https://github.com/aidenhong/nl-ae"

[tool.hatch.build.targets.wheel]
packages = ["src/nl_ae"]

[tool.hatch.build.targets.sdist]
include = ["src/nl_ae", "templates", "examples", "README.md", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers"
markers = [
  "gpu: requires a CUDA device + Qwen2.5-7B (skipped in CI)",
  "slow: takes more than a few seconds",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".plans"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]  # line length handled by formatter

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/nl_ae"]
exclude = ["tests/.*"]
